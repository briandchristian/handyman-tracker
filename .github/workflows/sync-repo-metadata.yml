# Syncs github.com description, homepage, and topics from .github/repo-metadata.json.
# Requires repo secret REPO_METADATA_PAT (classic PAT with repo scope) — otherwise this job is skipped.
name: Sync GitHub repo metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/repo-metadata.json'
      - '.github/workflows/sync-repo-metadata.yml'
      - 'scripts/sync-github-repo-metadata.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ secrets.REPO_METADATA_PAT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply metadata with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.REPO_METADATA_PAT }}
        run: node scripts/sync-github-repo-metadata.js
